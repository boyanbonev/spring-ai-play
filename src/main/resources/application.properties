spring.application.name=spring-ai-play
# spring.ai.google.genai.api-key= not supported

# I use vertex, because it can authenticate using the GCP authN file, while for google gen-ai I need an API-key,
# which I cannot get from google AI studio, because it is not enabled for the project
spring.ai.vertex.ai.gemini.project-id=
spring.ai.vertex.ai.gemini.location=us-central1


# available models - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/learn/model-versions
# spring.ai.vertex.ai.gemini.chat.options.model=gemini-2.5-flash

# Comma-separated Vertex allowlist for UI + POST /chat optional "model" field
app.chat.allowed-models=gemini-2.5-flash,gemini-2.5-pro,gemini-2.5-flash-lite

# Local Ollama tags (must not overlap with app.chat.allowed-models). Ollama must be running at base-url below.
app.chat.ollama-allowed-models=gemma4:e2b,ministral-3:3b

# Ollama HTTP API (default is typical local install). Integration tests use the same config; they passed without a
# running Ollama instance with the current Spring AI starter.
spring.ai.ollama.base-url=http://localhost:11434

# Local models (e.g. gemma) may need a higher token budget; Ollama defaults can truncate early. -1 = unlimited in Ollama.
spring.ai.ollama.chat.options.num-predict=-1

# Streaming /chat uses async request handling; the default timeout (often 30s) can cut off slow local inference.
spring.mvc.async.request-timeout=1m
# spring.ai.google.genai.chat.options.temperature=0.5